#:schema node_modules/wrangler/config-schema.json

name = "cynara-web"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
main = "@tanstack/react-start/server-entry"

# VITE_API_ORIGIN is build-time (it is compiled into the client bundle by Vite)
# and must be configured in the Cloudflare dashboard as a build environment
# variable, not here. CORS for the cynara-api origin is also configured there.
#
# API_ORIGIN is the SSR-side counterpart: it is read by the Worker at runtime
# (see src/api/client.ts) so SSR fetches reach cynara-api. Set it here to the
# same origin the client uses.
[vars]
API_ORIGIN = "https://cynara-api.livesanty.workers.dev"

[observability]
enabled = true
