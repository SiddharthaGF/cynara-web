# API client drift detection (CYN-56)
#
# Regenerates src/api/generated from cynara-api's committed OpenAPI contract
# and fails when the committed output is stale. The contract is fetched from a
# pinned ref of the API repository; drift on the API side is caught on the next
# run after the pin is advanced.
#
# Pinning: keep `API_CONTRACT_REF` default at a known-good SHA (short or full)
# rather than a branch. A branch default regenerates on the latest API state,
# which makes this workflow nondeterministic and forces every consumer to
# absorb upstream churn. Advance the pin deliberately, regenerate, and commit
# the new output in the same change.
#
# Docs: docs/api-client.md

name: API client drift

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      contract-ref:
        description: >-
          cynara-api ref (SHA or branch) whose contracts/openapi.json drives
          generation. Defaults to the pinned ref below.
        required: false
        type: string

env:
  # Pinned cynara-api contract ref (SHA recommended — see header comment).
  # `a160ae4` is the cynara-api main HEAD whose contract the committed
  # src/api/generated output was generated against.
  API_CONTRACT_REF:
    ${{ github.event.inputs.contract-ref ||
    'a160ae4343a44fa235a66fae6b242d1fb486101d' }}

concurrency:
  group: api-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the pinned OpenAPI contract
        # Download the contract to a local file and feed it through
        # OPENAPI_SPEC instead of OPENAPI_SPEC_URL: openapi-ts derives the
        # generated client's `baseUrl` from a URL input, which would produce a
        # spurious diff against the committed output (generated from a local
        # file).
        env:
          API_CONTRACT_REF: ${{ env.API_CONTRACT_REF }}
        run: >-
          curl -fsSL
          "https://raw.githubusercontent.com/SiddharthaGF/cynara-api/${API_CONTRACT_REF}/contracts/openapi.json"
          -o /tmp/openapi-contract.json

      - name: Regenerate client and fail on stale output
        env:
          OPENAPI_SPEC: /tmp/openapi-contract.json
        run: pnpm api:check

      - name: Generate the route tree
        # `routeTree.gen.ts` is gitignored and produced by the Vite plugin during
        # dev/build, so a fresh checkout has no copy. Build first to write it
        # before typechecking.
        run: pnpm build

      - name: Typecheck the regenerated client
        run: pnpm typecheck
