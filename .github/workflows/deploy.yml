name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
      CLOUDFLARE_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'cynara-web' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          cache: pnpm

      - name: Resolve VITE_API_ORIGIN (vars > wrangler.toml > fail)
        id: api-origin
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || '' }}
          PRODUCTION_BUILD:
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'}}
        run: |
          set -eo pipefail
          settings_url='https://github.com/ailuracode/cynara-web/settings/variables/actions'
          github_env="${GITHUB_ENV:-/dev/null}"
          github_output="${GITHUB_OUTPUT:-/dev/null}"

          if [ -n "${VITE_API_ORIGIN}" ]; then
            echo "Using VITE_API_ORIGIN from repository Actions variables."
            echo "source=vars" >> "$github_output"
            exit 0
          fi

          if [ -f wrangler.toml ]; then
            from_wrangler="$(awk -F'"' '/^VITE_API_ORIGIN[[:space:]]*=/ {print $2; exit}' wrangler.toml || true)"
            if [ -n "${from_wrangler}" ]; then
              echo "VITE_API_ORIGIN is not set in repository Actions variables; falling back to wrangler.toml [vars] (${from_wrangler})."
              echo "VITE_API_ORIGIN=${from_wrangler}" >> "$github_env"
              echo "source=wrangler" >> "$github_output"
              exit 0
            fi
          fi

          if [ "${PRODUCTION_BUILD}" = "true" ]; then
            echo "::error::VITE_API_ORIGIN is not configured." >&2
            echo "Production deploys require the cynara-api origin. Set it under ${settings_url} on this repo, or add a [vars] VITE_API_ORIGIN entry to wrangler.toml, so Vite can compile it into the client bundle." >&2
            exit 1
          fi

          echo "::warning::VITE_API_ORIGIN is not configured. PR smoke check will build with a placeholder origin; configure it under ${settings_url} on this repo, or add a [vars] VITE_API_ORIGIN entry to wrangler.toml, to compile the real cynara-api origin into the client bundle." >&2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Vite + @cloudflare/vite-plugin)
        run: pnpm build

      - name: Deploy (push to main only — production)
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HAS_CLOUDFLARE_CREDS:
            ${{ secrets.CLOUDFLARE_API_TOKEN != '' &&
            secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "${HAS_CLOUDFLARE_CREDS}" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured. Add them under Settings -> Secrets and variables -> Actions -> Secrets before pushing to main." >&2
            exit 1
          fi
          pnpm exec wrangler deploy --keep-vars --config dist/server/wrangler.json

      - name: Smoke check (PRs — uploads a Worker version without traffic)
        id: smoke
        if: github.event_name == 'pull_request'
        env:
          HAS_CLOUDFLARE_CREDS:
            ${{ secrets.CLOUDFLARE_API_TOKEN != '' &&
            secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "${HAS_CLOUDFLARE_CREDS}" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured. Skipping the PR smoke check; add them under Settings -> Secrets and variables -> Actions -> Secrets to enable Worker version uploads for PRs." >&2
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler versions upload --keep-vars --config dist/server/wrangler.json
