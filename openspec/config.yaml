# openspec/config.yaml
schema: spec-driven
store: hybrid

context: |
  Tech stack: React 19, TypeScript 7, Vite 8, TanStack Start/Router (file-based routes,
  SSR via Cloudflare workerd), Tailwind CSS 4 + shadcn, TanStack Query/Form, i18next (en/es),
  pnpm 11 / Node 22+.
  Architecture: private frontend for the Cynara clinical platform; browser client talks to
  cynara-api via /api; typed API client in src/api (generated by openapi-ts); main product
  area is the clinical form designer (schemas, drafts, validation, autosave).
  Testing: unit (vitest, node env) and E2E (Playwright) at the app root; workspace members
  packages/rule-engine and tools/api-client have no test scripts.
  Style: strict TS (no any), @/* alias, oxlint + oxfmt, i18n for user-facing text, lean
  contract-relevant comments.

strict_tdd: false

projects:
  - path: .
    stack: react-ts-vite (TanStack Start)
    test_command: pnpm test
    test_command_e2e: pnpm test:e2e
    framework: vitest + playwright
  - path: packages/rule-engine
    stack: vendored TS package
    test_command: ""
    framework: ""
  - path: tools/api-client
    stack: openapi-ts codegen tool
    test_command: ""
    framework: ""

testing:
  strict_tdd: false
  detected: 2026-09-04
  unit:
    available: true
    tool: vitest 4.1.10
    command: pnpm test
    note: node env; src/api|features|server __tests__; setup vitest.setup.ts
  integration:
    available: false
    note: no testing-library/jsdom; vitest environment is node
  e2e:
    available: true
    tool: @playwright/test 1.61.1
    command: pnpm test:e2e
    note: e2e/ suite, chromium + auth setup, real Vite dev server
  coverage:
    available: false
  lint:
    available: true
    tool: oxlint 1.74.0
    command: pnpm lint:check
  typecheck:
    available: true
    tool: tsc -b --noEmit (TS 7.0.2)
    command: pnpm typecheck
  formatter:
    available: true
    tool: oxfmt 0.59.0
    command: pnpm fmt:check
  note: >
    Strict TDD disabled: no explicit workspace-level test command covers every in-scope
    project (root vitest/playwright cover only the root; workspace members have no test
    scripts). Coverage threshold stays 0.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Keep clinical schema validation aligned with Cynara contracts; never silently drop unknown fields or validation errors
      - Treat autosave, concurrency, AI streaming, and draft mutations as async workflows with explicit cancellation and cleanup
    tdd: false
    test_command: pnpm test
  verify:
    test_command: pnpm test
    test_command_e2e: pnpm test:e2e
    build_command: pnpm build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas